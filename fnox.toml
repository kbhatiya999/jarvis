# fnox: environment for every mise/tilt command (plain text for now, no encryption).
#   fnox.toml        committed, non-secret defaults
#   fnox.local.toml  gitignored, your overrides and real secrets (auto-merged)
# Run anything with:  fnox exec -- <cmd>   (mise tasks already do this)

[secrets]
APP_VERSION = { default = "0.0.0-dev", description = "Version name baked into the APK (set by scripts/build-release.sh)" }
APP_VERSION_CODE = { default = "", description = "Android versionCode override; empty = minutes since 2020 (always increases)", if_missing = "ignore" }
SIGNING_KEYSTORE_PATH = { default = "", description = "Path to the release keystore", if_missing = "ignore" }
SIGNING_STORE_PASSWORD = { default = "", description = "Keystore password; set in fnox.local.toml", if_missing = "ignore" }
SIGNING_KEY_ALIAS = { default = "jarvis", description = "Key alias in the keystore", if_missing = "ignore" }
SIGNING_KEY_PASSWORD = { default = "", description = "Key password; set in fnox.local.toml", if_missing = "ignore" }
SIGNING_KEYSTORE_B64 = { default = "", description = "Base64 keystore, copied to GitHub secrets by `mise run tilt:secrets-push`", if_missing = "ignore" }
IOS_TEAM_ID = { default = "", description = "Your free Apple ID team (Xcode › Settings › Accounts) for simulator/iPhone builds from this Mac; empty = sign locally without a team. Set in fnox.local.toml", if_missing = "ignore" }
