min_version = "2026.1.0"

[tools]
java = "17"
gradle = "8.10.2"
tilt = "latest"
fnox = "latest"
gh = "latest"
android-sdk = "latest"

# Every task runs through fnox so env (fnox.toml + fnox.local.toml) is always loaded.

[tasks.setup]
description = "Install Android SDK packages (idempotent)"
run = "scripts/setup-android.sh"

[tasks.build]
depends = ["setup"]
description = "Build the debug APK"
run = "scripts/run.sh ./gradlew --no-daemon assembleDebug"
sources = ["app/src/**/*", "app/build.gradle.kts", "build.gradle.kts", "settings.gradle.kts"]
outputs = ["app/build/outputs/apk/debug/app-debug.apk"]

[tasks."build:release"]
depends = ["setup"]
description = "Build the signed release APK (needs signing vars from fnox.local.toml)"
run = "scripts/build-release.sh"

[tasks.lint]
depends = ["setup"]
description = "Run Android lint"
run = "scripts/run.sh ./gradlew --no-daemon lint"

[tasks.clean]
description = "Remove build outputs"
run = "./gradlew clean"

[tasks.install]
description = "Build with the release key and install on the USB/wifi-connected phone (upgrades the Obtainium copy)"
run = "scripts/install.sh"

[tasks.devices]
description = "List phones/emulators adb can see"
depends = ["setup"]
run = "$ANDROID_HOME/platform-tools/adb devices -l"

[tasks."keystore:gen"]
description = "Create a release keystore and store its details in fnox.local.toml (plain text)"
run = "scripts/gen-keystore.sh"

[tasks."secrets:push"]
description = "Upload signing secrets from fnox.local.toml to GitHub Actions secrets"
run = "scripts/push-secrets.sh"

[tasks.release]
description = "Tag and push a release: mise run release 0.2.0 (CI builds and publishes the APK)"
run = "scripts/release.sh"

[tasks."tilt:up"]
description = "Open the Tilt dashboard for the workflow"
run = "tilt up"

[tasks."tilt:down"]
description = "Stop Tilt"
run = "tilt down"

# tilt:* tasks drive an already-running Tilt (mise run tilt:up). They trigger
# resources, so the run shows up in the dashboard with logs and status.

[tasks."tilt:lint"]
description = "Trigger the lint resource in Tilt"
run = "tilt trigger lint"

[tasks."tilt:build"]
description = "Trigger the build resource in Tilt"
run = "tilt trigger build"

[tasks."tilt:install"]
description = "Trigger install-on-device in Tilt"
run = "tilt trigger install-on-device"

[tasks."tilt:secrets-push"]
description = "Trigger secrets-push in Tilt"
run = "tilt trigger secrets-push"

[tasks."tilt:release"]
description = "Trigger a release in Tilt: mise run tilt:release 0.2.0"
usage = 'arg "<version>" help="Semver x.y.z"'
run = '''
tilt args -- --version "${usage_version}"
sleep 6   # let Tilt reload the Tiltfile with the new version
tilt trigger release
'''

[tasks."tilt:logs"]
description = "Show Tilt logs (no follow): mise run tilt:logs [resource]"
usage = 'arg "[resource]" help="Resource name; all if omitted"'
run = 'tilt logs --since 10m ${usage_resource:-}'

[tasks."tilt:status"]
description = "Show status of every Tilt resource"
run = '''
tilt get uiresource -o json | jq -r '.items[] | select(.metadata.name != "(Tiltfile)") | [.metadata.name, (.status.updateStatus // "-"), (if (.status.buildHistory[0].error // "") != "" then "FAILED: " + .status.buildHistory[0].error else "ok/none" end), (.status.buildHistory[0].finishTime // "never")] | @tsv' | column -t -s "$(printf '\t')"
'''

# Wireless debugging (Android 11+): phone and Mac on the same Wi-Fi.
[tasks."phone:pair"]
description = "Pair over Wi-Fi: mise run phone:pair <ip:port> <code> (from 'Pair device with pairing code')"
depends = ["setup"]
usage = '''
arg "<address>" help="IP:port shown in the pairing dialog"
arg "<code>" help="6-digit pairing code"
'''
run = '$ANDROID_HOME/platform-tools/adb pair "${usage_address}" "${usage_code}"'

[tasks."phone:connect"]
description = "Connect over Wi-Fi: mise run phone:connect [ip:port] (no address = auto-discover paired phone)"
depends = ["setup"]
usage = 'arg "[address]" help="IP:port on the Wireless debugging screen"'
run = '''
ADB="$ANDROID_HOME/platform-tools/adb"
if [ -n "${usage_address:-}" ]; then
  "$ADB" connect "${usage_address}"
else
  addr="$("$ADB" mdns services | awk '/_adb-tls-connect/ {print $NF; exit}')"
  [ -n "$addr" ] || { echo "No paired phone found on Wi-Fi; pass the IP:port from the Wireless debugging screen." >&2; exit 1; }
  "$ADB" connect "$addr"
fi
"$ADB" devices -l
'''
