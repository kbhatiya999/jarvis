min_version = "2026.1.0"

# mise provides everything the project needs, including the Android SDK.
[tools]
java = "17"
gradle = "8.14.3"
android-sdk = "latest"
tilt = "latest"
fnox = "latest"
gh = "latest"
xcodegen = { version = "latest", os = ["macos"] } # generates ios/Jarvis.xcodeproj
jq = "latest"
# The Jarvis bridge (bridge/): an MCP server on Cloudflare Workers
node = "24"
"npm:wrangler" = "4.158.0"
cloudflared = "2026.10.7" # tilt:bridge-tunnel: public https address for the local bridge
ruby = "3.4"
cmake = "latest" # gollum: builds rugged (libgit2)
"conda:pkgconf" = "latest" # gollum: rugged needs pkg-config
ghcup = "latest" # tilt:gitit: GHC + cabal installed into .tilt-inputs, gitit built on first run
uv = "latest" # tilt:otterwiki runs from PyPI via uv
"github:go-gitea/gitea" = { version = "latest", asset_pattern = "gitea-*-darwin-arm64", os = ["macos"] } # tilt:gitea (forgejo comes from brew: no macOS binary)
"github:perber/leafwiki" = { version = "latest", asset_pattern = "leafwiki-*-darwin-arm64", os = ["macos"] } # tilt:leafwiki: wiki, Markdown on disk

# How to use this file
#
#   mise tasks              lists the commands to use: all tilt:*
#   mise run tilt:<name>    presses that button in Tilt (starting Tilt if needed), streams
#                           its log here and waits for the result, so every run is visible
#                           in the dashboard at http://localhost:10350
#
# The hidden tasks below the line are the individual steps Tilt runs. Use the tilt:* tasks
# instead of calling them directly. Nothing runs automatically (not on save, commit or push).

# ================================================================ tilt: use these

[tasks."tilt:up"]
description = "Run Tilt in this terminal (tilt:* tasks also start it in the background)"
run = "tilt up"

[tasks."tilt:down"]
description = "Stop Tilt"
run = "tilt down"

[tasks."tilt:status"]
description = "Status of every step and pipeline"
run = '''
scripts/tilt-ensure.sh
tilt get uiresource -o json | jq -r '.items[] | select(.metadata.name != "(Tiltfile)") | [(.metadata.labels | keys | map(select(startswith("label:"))) | first // "" | sub("label:"; "")), .metadata.name, (.status.updateStatus // "-"), (if (.status.buildHistory[0].error // "") != "" then "FAILED: " + .status.buildHistory[0].error else "" end), (.status.buildHistory[0].finishTime // "never")] | @tsv' | sort | column -t -s "$(printf '\t')"
'''

[tasks."tilt:logs"]
description = "Recent logs: mise run tilt:logs [name]"
usage = 'arg "[name]" help="Step or pipeline; all if omitted"'
run = 'scripts/tilt-ensure.sh && tilt logs --since 30m ${usage_name:-}'

# ---- the usual two

[tasks."tilt:release"]
description = "Release from this Mac: check -> lint -> signed build -> publish for Obtainium"
usage = '''
arg "[version]" help="x.y.z; defaults to the next patch"
flag "--log-level <level>" help="What the app logs by default: error, warn, info (default) or debug. Use debug for a release we are unsure about."
'''
run = 'scripts/tilt-input.sh version "${usage_version:-}" && scripts/tilt-input.sh log-level "${usage_log_level:-}" && scripts/tilt-run.sh release'

[tasks."tilt:install"]
description = "Install on the phone: signed dev build -> adb install (upgrades the Obtainium copy)"
run = "scripts/tilt-run.sh install"

# ---- steps

[tasks."tilt:lint"]
description = "Run Android lint"
run = "scripts/tilt-run.sh lint"

[tasks."tilt:test"]
description = "Run the unit tests (shared Kotlin code)"
run = "scripts/tilt-run.sh test"

[tasks."tilt:build"]
description = "Build the signed APK (the only build; release and install use it too)"
run = "scripts/tilt-run.sh build"

[tasks."tilt:build-ci"]
description = "Build on GitHub Actions (same script and key); downloads the APK"
run = "scripts/tilt-run.sh build-ci"

[tasks."tilt:release-ci"]
description = "Release on GitHub Actions instead of this Mac"
usage = '''
arg "[version]" help="x.y.z; defaults to the next patch"
flag "--log-level <level>" help="What the app logs by default: error, warn, info (default) or debug."
'''
run = 'scripts/tilt-input.sh version "${usage_version:-}" && scripts/tilt-input.sh log-level "${usage_log_level:-}" && scripts/tilt-run.sh release-ci'

[tasks."tilt:ios-build"]
description = "Build the iOS app (.ipa for AltStore/SideStore); needs Xcode"
run = "scripts/tilt-run.sh ios-build"

[tasks."tilt:ios-sim"]
description = "Run the iOS app in the iPhone simulator; needs Xcode"
run = "scripts/tilt-run.sh ios-sim"

[tasks."tilt:devices"]
description = "List phones adb can see"
run = "scripts/tilt-run.sh devices"

[tasks."tilt:phone-pair"]
description = "Pair over Wi-Fi (Wireless debugging -> Pair device with pairing code)"
usage = '''
arg "<address>" help="IP:port shown in the pairing dialog"
arg "<code>" help="Pairing code"
'''
run = '''
scripts/tilt-input.sh pair-address "${usage_address}"
scripts/tilt-input.sh pair-code "${usage_code}"
scripts/tilt-run.sh phone-pair
'''

[tasks."tilt:phone-connect"]
description = "Connect to the paired phone over Wi-Fi"
usage = 'arg "[address]" help="IP:port from the Wireless debugging screen; found automatically if omitted"'
run = 'scripts/tilt-input.sh connect-address "${usage_address:-}" && scripts/tilt-run.sh phone-connect'

[tasks."tilt:phone-logs"]
description = "Jarvis's own log from the phone (dev builds): mise run tilt:phone-logs [filter] [lines]"
usage = '''
arg "[filter]" help="Only lines containing this, e.g. Agent"
arg "[lines]" help="How many lines (default 200)"
'''
run = 'scripts/tilt-input.sh logs-filter "${usage_filter:-}" && scripts/tilt-input.sh logs-lines "${usage_lines:-}" && scripts/tilt-run.sh phone-logs'

[tasks."tilt:env-check"]
description = "Check the fnox environment"
run = "scripts/tilt-run.sh env-check"

[tasks."tilt:setup"]
description = "Install Android SDK packages"
run = "scripts/tilt-run.sh setup"

[tasks."tilt:keystore-gen"]
description = "Create the release signing key (once)"
run = "scripts/tilt-run.sh keystore-gen"

[tasks."tilt:secrets-push"]
description = "Copy the signing key to GitHub secrets (for the Release/Build workflows)"
run = "scripts/tilt-run.sh secrets-push"

# ---- the Jarvis bridge (bridge/): lets the Gemini app speak through Jarvis

[tasks."tilt:bridge-setup"]
description = "Once: Cloudflare token and account for the bridge, into fnox.local.toml (asks in this terminal)"
usage = 'flag "--reset" help="Replace the saved token"'
run = 'scripts/bridge-setup.sh ${usage_reset:+--reset}'

[tasks."tilt:bridge-check"]
description = "Check the bridge's Cloudflare setup (never prints the token)"
run = "scripts/tilt-run.sh bridge-check"

[tasks."tilt:bridge-test"]
description = "Bridge tests"
run = "scripts/tilt-run.sh bridge-test"

[tasks."tilt:bridge-dev"]
description = "Run the bridge locally (a Tilt service, restarts on change) on http://localhost:8787"
run = "scripts/bridge-serve.sh dev"

[tasks."tilt:gollum"]
description = "Run Gollum (wiki over the project root's git repo) as a Tilt service on http://localhost:4567"
run = "scripts/tilt-serve.sh gollum \"curl -fsS http://localhost:4567 >/dev/null && echo 'Gollum running: http://localhost:4567'\""

[tasks."tilt:otterwiki"]
description = "Run Otter Wiki (wiki over this repo; first account becomes admin) as a Tilt service on http://localhost:5050"
run = "scripts/tilt-serve.sh otterwiki \"curl -fsS http://localhost:5050/-/index >/dev/null && echo 'Otter Wiki running: http://localhost:5050'\""

[tasks."tilt:gitit"]
description = "Run Gitit (wiki over the project root's git repo) as a Tilt service on http://localhost:5001; the first run builds it (slow)"
run = "scripts/tilt-serve.sh gitit \"curl -fsS http://localhost:5001/ >/dev/null && echo 'Gitit running: http://localhost:5001'\""

[tasks."tilt:gitea"]
description = "Run Gitea (git forge; first visit shows its setup page) as a Tilt service on http://localhost:3000"
run = "scripts/tilt-serve.sh gitea \"curl -fsS http://localhost:3000/ >/dev/null && echo 'Gitea running: http://localhost:3000'\""

[tasks."tilt:forgejo"]
description = "Run Forgejo (git forge; first visit shows its setup page) as a Tilt service on http://localhost:3001"
run = "scripts/tilt-serve.sh forgejo \"curl -fsS http://localhost:3001/ >/dev/null && echo 'Forgejo running: http://localhost:3001'\""

[tasks."tilt:leafwiki"]
description = "Run LeafWiki (Markdown wiki in .scratch/leafwiki, local only, no login) as a Tilt service on http://localhost:8080"
run = "scripts/tilt-serve.sh leafwiki \"curl -fsS http://localhost:8080 >/dev/null && echo 'LeafWiki running: http://localhost:8080'\""

[tasks."tilt:bridge-tunnel"]
description = "Public https address for the local bridge (temporary, changes each run), to test with the real Gemini"
run = "scripts/bridge-serve.sh tunnel"

[tasks."tilt:bridge-deploy"]
description = "Test and deploy the bridge to Cloudflare Workers; saves its address as BRIDGE_URL for app builds"
run = "scripts/tilt-run.sh bridge-deploy"

[tasks."tilt:bridge-deploy-ci"]
description = "Deploy the bridge from GitHub Actions instead of this Mac"
run = "scripts/tilt-run.sh bridge-deploy-ci"

[tasks."tilt:bridge-logs"]
description = "Live logs of the deployed bridge (Ctrl-C to stop)"
run = "scripts/bridge-logs.sh"

# ================================================================ steps (hidden; run by Tilt)

[tasks."phone:logs"]
hide = true
description = "Show Jarvis's log from the phone"
run = 'scripts/phone-logs.sh "$(cat .tilt-inputs/logs-filter 2>/dev/null || true)" "$(cat .tilt-inputs/logs-lines 2>/dev/null || echo 200)"'

[tasks."bridge:check"]
hide = true
description = "Check the Cloudflare setup"
run = "scripts/bridge-check.sh"

[tasks."bridge:test"]
hide = true
description = "Bridge unit tests"
run = "cd bridge && npm test --silent"

[tasks."gollum:serve"]
hide = true
description = "Gollum on localhost:4567 (gem installed into .tilt-inputs/gems on first run)"
run = '''
export GEM_HOME="$PWD/.tilt-inputs/gems" PATH="$PWD/.tilt-inputs/gems/bin:$PATH"
command -v gollum >/dev/null || gem install gollum --no-document
mkdir -p .tilt-inputs
printf "Precious::App.set(:wiki_options, { index_page: 'README', h1_title: true })\n" > .tilt-inputs/gollum-config.rb
exec gollum . --host 127.0.0.1 --port 4567 --ref main --config .tilt-inputs/gollum-config.rb
'''

[tasks."otterwiki:serve"]
hide = true
description = "Otter Wiki on localhost:5050 (from PyPI via uv)"
run = '''
mkdir -p .tilt-inputs/otterwiki
printf "REPOSITORY = '%s'\nSECRET_KEY = 'local-only-not-a-secret'\nHOME_PAGE = 'README'\n" "$PWD" > .tilt-inputs/otterwiki/settings.cfg
export OTTERWIKI_SETTINGS="$PWD/.tilt-inputs/otterwiki/settings.cfg"
exec uv run --no-project --with otterwiki flask --app otterwiki.server run --host 127.0.0.1 --port 5050
'''

[tasks."gitit:serve"]
hide = true
description = "Gitit on localhost:5001 (GHC, cabal and gitit installed into .tilt-inputs on first run)"
run = '''
export GHCUP_INSTALL_BASE_PREFIX="$PWD/.tilt-inputs/haskell" CABAL_DIR="$PWD/.tilt-inputs/haskell/cabal"
export PATH="$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin:$CABAL_DIR/bin:$PATH"
if ! command -v ghc >/dev/null; then
  ghcup install ghc recommended --set
  ghcup install cabal recommended --set
fi
if ! command -v gitit >/dev/null; then
  cabal update
  cabal install gitit --install-method=copy --installdir="$CABAL_DIR/bin" --overwrite-policy=always
fi
mkdir -p .tilt-inputs/gitit
repo="$PWD"
cd .tilt-inputs/gitit  # gitit writes static/ and templates/ into its working directory
[ -f gitit.conf ] || gitit --print-default-config > gitit.conf
perl -pi -e "s/^port:.*/port: 5001/; s/^address:.*/address: 127.0.0.1/; s|^repository-path:.*|repository-path: $repo|; s/^repository-type:.*/repository-type: Git/; s/^default-extension:.*/default-extension: md/; s/^front-page:.*/front-page: README/" gitit.conf
exec gitit -f gitit.conf
'''

[tasks."gitea:serve"]
hide = true
description = "Gitea on localhost:3000, data in .tilt-inputs/gitea"
run = '''
export PATH="$PATH"
mkdir -p .tilt-inputs/gitea
[ -f .tilt-inputs/gitea/app.ini ] || printf '[server]\nHTTP_ADDR = 127.0.0.1\nHTTP_PORT = 3000\nDISABLE_SSH = true\nROOT_URL = http://localhost:3000/\n[database]\nDB_TYPE = sqlite3\n' > .tilt-inputs/gitea/app.ini
exec gitea web --work-path "$PWD/.tilt-inputs/gitea" --config "$PWD/.tilt-inputs/gitea/app.ini"
'''

[tasks."forgejo:serve"]
hide = true
description = "Forgejo on localhost:3001, data in .tilt-inputs/forgejo"
run = '''
export PATH="/opt/homebrew/bin:$PATH"
mkdir -p .tilt-inputs/forgejo
[ -f .tilt-inputs/forgejo/app.ini ] || printf '[server]\nHTTP_ADDR = 127.0.0.1\nHTTP_PORT = 3001\nDISABLE_SSH = true\nROOT_URL = http://localhost:3001/\n[database]\nDB_TYPE = sqlite3\n' > .tilt-inputs/forgejo/app.ini
exec forgejo web --work-path "$PWD/.tilt-inputs/forgejo" --config "$PWD/.tilt-inputs/forgejo/app.ini"
'''

[tasks."leafwiki:serve"]
hide = true
description = "LeafWiki on localhost:8080"
run = 'mkdir -p .scratch/leafwiki && exec leafwiki --host=127.0.0.1 --port=8080 --data-dir=.scratch/leafwiki --disable-auth --allow-insecure=true'

[tasks."bridge:dev"]
hide = true
description = "Bridge on localhost, restarting on change"
run = 'cd bridge && PORT="${BRIDGE_PORT:-$(fnox get BRIDGE_PORT 2>/dev/null || echo 8787)}" exec node --watch src/node.js'

[tasks."bridge:tunnel"]
hide = true
description = "cloudflared quick tunnel to the local bridge"
run = 'exec cloudflared tunnel --no-autoupdate --url "http://localhost:${BRIDGE_PORT:-$(fnox get BRIDGE_PORT 2>/dev/null || echo 8787)}"'

[tasks."bridge:deploy"]
hide = true
description = "Test and deploy the bridge"
run = "scripts/bridge-deploy.sh"

[tasks."bridge:deploy-ci"]
hide = true
description = "Run the Bridge workflow on GitHub"
run = "scripts/ci-run.sh bridge-deploy"

[tasks.setup]
hide = true
description = "Install Android SDK packages (idempotent)"
run = "scripts/setup-android.sh"

[tasks."env:check"]
hide = true
description = "Check fnox config resolves"
run = "fnox check"

[tasks."keystore:gen"]
hide = true
description = "Create the release signing key once; details go to fnox.local.toml (plain text)"
run = "scripts/gen-keystore.sh"

[tasks."secrets:push"]
hide = true
description = "Copy signing settings from fnox.local.toml to GitHub Actions secrets"
run = "scripts/push-secrets.sh"

[tasks.lint]
hide = true
description = "Android lint"
depends = ["setup"]
run = "scripts/run.sh ./gradlew --no-daemon lintRelease"

[tasks.test]
hide = true
description = "Unit tests of the shared module"
depends = ["setup"]
run = "scripts/run.sh ./gradlew --no-daemon :shared:testDebugUnitTest"

[tasks.build]
hide = true
description = "Signed APK (the one build path)"
depends = ["setup"]
run = "scripts/build.sh"

[tasks."ios:build"]
hide = true
description = "iOS .ipa (unsigned; AltStore/SideStore sign it)"
run = "scripts/ios-build.sh ipa"

[tasks."ios:release-build"]
hide = true
description = "iOS .ipa for a release; skipped with a warning if Xcode is missing"
run = "IOS_OPTIONAL=1 scripts/ios-build.sh ipa"

[tasks."ios:sim"]
hide = true
description = "Build for and launch in the iOS simulator"
run = "scripts/ios-run.sh"

[tasks."build:ci"]
hide = true
description = "Run the Build workflow on GitHub and download the APK"
run = "scripts/ci-run.sh build"

[tasks."release:ci"]
hide = true
description = "Run the Release workflow on GitHub"
run = "scripts/ci-run.sh release"

[tasks.clean]
hide = true
description = "Remove build outputs"
run = "./gradlew clean"

[tasks.devices]
hide = true
description = "List phones adb can see"
depends = ["setup"]
run = "$ANDROID_HOME/platform-tools/adb devices -l"

[tasks."phone:pair"]
hide = true
description = "adb pair with the address/code from .tilt-inputs"
depends = ["setup"]
run = "scripts/phone-pair.sh"

[tasks."phone:connect"]
hide = true
description = "adb connect to the paired phone"
depends = ["setup"]
run = "scripts/phone-connect.sh"

[tasks.install]
description = "Signed dev build, then install on the phone"
hide = true
depends = ["setup"]
run = "scripts/install.sh"

[tasks."release:check"]
hide = true
description = "Pick the version and check the release is safe"
run = "scripts/release-check.sh"

[tasks."release:publish"]
hide = true
description = "Tag and publish the GitHub release with the APK"
run = "scripts/release-publish.sh"

[tasks."version:next"]
hide = true
description = "Print the next patch version"
run = "scripts/next-version.sh"
