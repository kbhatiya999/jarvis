name: Build

# Build dev versions without releasing: Actions -> Build -> Run workflow. Artifacts:
#   jarvis-apk  Android (a zip; open it on the phone and install the APK). Same build script
#               and signing key as the Mac, so it installs over any other copy.
#   jarvis-ipa  iOS, unsigned (install with AltStore/SideStore, which sign it).
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Repo secrets missing; run: mise run tilt:secrets-push"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: lint
        run: mise run -q lint
      - name: test
        run: mise run -q test
      - name: build
        run: mise run -q build
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/release/jarvis-*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
      - name: ios-build
        run: mise run -q ios:build
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ipa
          path: ios/build/jarvis-*.ipa
